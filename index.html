function language(n){const l=LANG.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!l)return missing();const ex=EX[l.name]||['// ตัวอย่างเริ่มต้นของ '+l.name+'\n// ตรวจวิธีรันจากเอกสารทางการ','ตัวอย่างเริ่มต้นสำหรับศึกษา ไวยากรณ์และวิธีรันขึ้นอยู่กับเครื่องมือ'];show('<p class="muted"><a href="#home">หน้าแรก</a> / <a href="#languages">ภาษาและเครื่องมือ</a> / '+esc(l.name)+'</p><article class="article"><span class="pill">'+esc(l.slug)+'</span><h1>'+esc(l.name)+'</h1><p>'+esc(l.name)+' เป็นหนึ่งในหัวข้อของคลัง CodeAtlas TH หน้านี้เป็นจุดเริ่มต้นสำหรับศึกษาภาษาและเครื่องมือนี้</p><h2>1. ใช้ทำอะไร?</h2><p>แต่ละภาษาและเครื่องมือถูกสร้างมาเพื่อแก้ปัญหาคนละแบบ ควรเลือกตามประเภทงาน ความสามารถ และเครื่องมือที่รองรับ</p><h2>2. วิธีทำงานโดยทั่วไป</h2><ol><li>สร้างไฟล์ให้ตรงกับชนิดภาษา</li><li>เขียนคำสั่งตามกติกาของภาษา</li><li>ส่งไฟล์ให้ตัวแปลภาษา คอมไพเลอร์ หรือเครื่องมืออ่าน</li><li>ตรวจข้อผิดพลาดและประมวลผล</li><li>ดูผลลัพธ์และปรับปรุง</li></ol><div class="callout">บางภาษาต้องคอมไพล์ก่อน บางภาษาทำงานผ่าน runtime และบางรายการเป็นรูปแบบข้อมูลหรือเครื่องมือ ไม่ใช่ภาษาโปรแกรมโดยตรง</div><h2>3. ตัวอย่างโค้ด</h2><p>'+esc(ex[1])+'</p>'+code(ex[0])+'<h2>4. เส้นทางเรียน 10 บท</h2>'+lessons()+'<h2>5. ฝึกด้วยตัวเอง</h2><p>ลองเปลี่ยนข้อความหรือค่าตัวแปร แล้วรันใหม่ สังเกตผลลัพธ์และอธิบายแต่ละบรรทัดด้วยคำของตัวเอง</p><p><a href="https://github.com/somegameprojects-studio/ALL-LANGUAGES-PROGRAMMING/tree/main/languages/'+encodeURIComponent(l.slug)+'" target="_blank" class="btn alt">เปิดคู่มือใน GitHub ↗</a></p></article>')}
function learn(){show('<div class="eyebrow">LEARNING PATH</div><h1>พื้นฐานการเขียนโปรแกรม</h1><p class="muted">เรียนทีละเรื่อง ไม่จำเป็นต้องจำทุกคำสั่งในครั้งเดียว</p><article class="article"><h2>โปรแกรมทำงานอย่างไร?</h2><p>โปรแกรมคือชุดคำสั่งที่เราจัดเตรียมไว้เพื่อให้คอมพิวเตอร์ทำงานตามลำดับ</p><ol><li><b>รับข้อมูล:</b> จากผู้ใช้ ไฟล์ หรือระบบอื่น</li><li><b>ประมวลผล:</b> คำนวณ ตรวจเงื่อนไข หรือจัดการข้อมูล</li><li><b>แสดงผล:</b> ส่งคำตอบออกทางหน้าจอหรือระบบอื่น</li></ol>'+code('name = "Mina"\nmessage = "สวัสดี " + name\nprint(message)')+'<h2>บทเรียน 10 ขั้น</h2>'+lessons()+'<h2>เคล็ดลับสำหรับผู้เริ่มต้น</h2><ul><li>เลือกภาษาเดียวก่อน</li><li>พิมพ์โค้ดเอง ไม่ใช่แค่คัดลอก</li><li>เปลี่ยนค่าทีละจุดแล้วดูผล</li><li>อ่านข้อความ error และแก้ทีละจุด</li></ul></article>')}
function practice(){show('<div class="eyebrow">PRACTICE ZONE</div><h1>แบบฝึกหัด</h1><p class="muted">ลองคิดก่อนเปิดดูแนวคำตอบ</p>'+[['แสดงข้อความ','เขียนคำสั่งให้แสดง Hello, World!','Python: print("Hello, World!")'],['เก็บข้อมูล','สร้างตัวแปรชื่อ แล้วแสดงข้อความทักทาย','name = "Mina" แล้ว print("สวัสดี", name)'],['ตรวจเงื่อนไข','คะแนน 50 ขึ้นไปให้แสดง ผ่าน มิฉะนั้นแสดง ลองอีกครั้ง','ใช้ if ตรวจคะแนน และ else สำหรับกรณีอื่น'],['ทำซ้ำ','แสดงเลข 1 ถึง 5','ใช้ for loop ทำคำสั่งซ้ำ 5 รอบ']].map((x,i)=>'<div class="exercise"><b>ข้อ '+(i+1)+': '+x[0]+'</b><p>'+x[1]+'</p><button class="btn alt reveal">ดูแนวคำตอบ</button><div class="answer">'+x[2]+'</div></div>').join(''))}

function structure(){show('<div class="eyebrow">REPOSITORY MAP</div><h1>โครงสร้าง Repository</h1><p class="muted">แผนที่ไฟล์สำหรับผู้ที่อยากดูโครงสร้างและร่วมพัฒนา</p><div class="tree">ALL-LANGUAGES-PROGRAMMING/\n├── index.html              เว็บไซต์ GitHub Pages\n├── .github/workflows/      ตั้งค่าการเผยแพร่เว็บ\n├── languages/              คู่มือแยกตามภาษา\n├── language-examples/      ตัวอย่างซอร์สโค้ดจริง\n├── examples/               ตัวอย่างรวม\n├── docs/                   เอกสารประกอบ\n├── tutorials/              บทเรียน\n├── projects/               โปรเจกต์ฝึกทำ\n├── resources/              แหล่งเรียนรู้เพิ่มเติม\n├── LANGUAGES.md            สารบัญภาษา\n├── CONTRIBUTING.md         แนวทางร่วมพัฒนา\n└── README.md               หน้าแนะนำ Repository</div><div class="grid" style="margin-top:15px"><div class="card"><h3>languages/</h3><p>คู่มืออธิบายแนวคิดและจุดเริ่มต้นแต่ละภาษา</p></div><div class="card"><h3>language-examples/</h3><p>ไฟล์โค้ดจริงแยกตามภาษา</p></div><div class="card"><h3>.github/workflows/</h3><p>ระบบเผยแพร่เว็บไซต์อัตโนมัติ</p></div></div><p><a class="btn" href="https://github.com/somegameprojects-studio/ALL-LANGUAGES-PROGRAMMING" target="_blank">เปิด Repository ↗</a></p>')}

function playground(){show('<div class="eyebrow">SAFE JAVASCRIPT PLAYGROUND</div><h1>ทดลองเขียนโค้ด</h1><p class="muted">พื้นที่ทดลอง JavaScript ในกล่องแยกจากหน้าเว็บ กด Run เพื่อดูผลลัพธ์</p><div class="callout">ตอนนี้รองรับ JavaScript เท่านั้น โค้ดจะทำงานใน iframe แบบ sandbox และไม่สามารถเข้าถึงข้อมูลในหน้าเว็บหลักได้</div><div class="toolbar"><button class="btn" id="runCode">▶ Run code</button><button class="btn alt" id="resetCode">รีเซ็ต</button><span class="note">ตัวอย่างเริ่มต้น: แก้โค้ดได้เลย</span></div><div class="playbox"><div><b>โค้ด JavaScript</b><textarea class="editor" id="editor" spellcheck="false">const name = "โลก";\nconsole.log("สวัสดี " + name);\nconsole.log("2 + 3 =", 2 + 3);</textarea></div><div><b>ผลลัพธ์</b><pre class="output" id="output">ผลลัพธ์จะแสดงที่นี่...</pre></div></div><p class="note">ข้อควรทราบ: เป็น playground สำหรับทดลองพื้นฐาน ไม่ใช่ระบบรันโค้ด production และไม่รองรับ Node.js หรือการติดตั้งแพ็กเกจ</p>');const initial='const name = "โลก";\\nconsole.log("สวัสดี " + name);\\nconsole.log("2 + 3 =", 2 + 3);';const run=()=>{const src=$('#editor').value.replace(/</g,'\\u003c');const frame=document.createElement('iframe');frame.setAttribute('sandbox','allow-scripts');frame.style.display='none';frame.srcdoc='<script>const send=(...a)=>parent.postMessage({atlasOutput:a.map(x=>{try{return typeof x==="string"?x:JSON.stringify(x)}catch(e){return String(x)}}).join(" ")},"*");console.log=(...a)=>send(...a);try{(function(){'+src+'\\n})();}catch(e){console.log("Error: "+e.message)}<\\/script>';document.body.appendChild(frame);const listener=e=>{if(e.data&&typeof e.data.atlasOutput==="string"){$("#output").textContent=e.data.atlasOutput;window.removeEventListener("message",listener);frame.remove()}};window.addEventListener('message',listener);setTimeout(()=>{window.removeEventListener('message',listener);if(frame.isConnected)frame.remove()},1500)};$('#runCode').onclick=run;$('#resetCode').onclick=()=>{$('#editor').value='const name = "โลก";\\nconsole.log("สวัสดี " + name);\\nconsole.log("2 + 3 =", 2 + 3);';$('#output').textContent='ผลลัพธ์จะแสดงที่นี่...'};}show('<div class="empty"><h2>ไม่พบหน้าที่ต้องการ</h2><a class="btn" href="#home">กลับหน้าแรก</a></div>')}

function route(){let [p,...r]=decodeURIComponent(location.hash.slice(1)||'home').split('/');if(p==='home')home();else if(p==='languages')languages();else if(p==='language')language(r.join('/'));else if(p==='learn')learn();else if(p==='playground')playground();else if(p==='practice')practice();else if(p==='projects')projects();else if(p==='structure')structure();else if(p==='glossary')glossary();else missing()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-copy]');if(b){navigator.clipboard?.writeText(decodeURIComponent(b.dataset.copy));b.textContent='คัดลอกแล้ว'}let r=e.target.closest('.reveal');if(r){let a=r.nextElementSibling;a.classList.toggle('show');r.textContent=a.classList.contains('show')?'ซ่อนแนวคำตอบ':'ดูแนวคำตอบ'}});
document.addEventListener('input',e=>{if(e.target.id==='q'||e.target.id==='kind'){let q=$('#q').value.toLowerCase(),k=$('#kind').value,n=0;document.querySelectorAll('.lang').forEach(a=>{let l=LANG.find(x=>x.name.toLowerCase()===a.dataset.name),name=l.name.toLowerCase(),isTool=['json','yaml','xml','latex','makefile','cmake','dockerfile','terraform hcl','graphql','regex'].includes(name),isSpecial=['assembly','shaderlab','gdshader','glsl','hlsl','wgsl','solidity','vyper','move','cypher','sparql'].includes(name),category=isTool?'รูปแบบข้อมูล / เครื่องมือ':isSpecial?'เฉพาะทาง':'ภาษาโปรแกรม',ok=name.includes(q)&&(!k||category===k);a.style.display=ok?'flex':'none';if(ok)n++});$('#count').textContent=n+' รายการ'}});
$('#menu').onclick=()=>$('#nav').classList.toggle('open');$('#nav').onclick=e=>{if(e.target.tagName==='A')$('#nav').classList.remove('open')};window.addEventListener('hashchange',route);route();
